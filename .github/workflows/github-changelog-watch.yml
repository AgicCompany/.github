name: GitHub Changelog Watch

# Ogni giorno legge il GitHub Changelog e apre un'issue (label changelog-watch, assegnata a
# NOTIFY_USERS) per ogni nuovo annuncio sullo status nativo delle issue (public preview).
on:
  schedule:
    - cron: '0 7 * * *'   # ogni giorno alle 07:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Esegui senza creare issue (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write

# Evita run sovrapposti (doppie issue per lo stesso annuncio).
concurrency:
  group: github-changelog-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Controlla il GitHub Changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY_USERS: ${{ vars.CHANGELOG_NOTIFY_USERS || 'alessiooliverioagic' }}
          CUTOFF: '2026-11-24T00:00:00Z'
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          DRY=""
          if [ "$DRY_RUN" = "true" ]; then DRY="--dry-run"; fi
          node scripts/changelog-watch.mjs $DRY
